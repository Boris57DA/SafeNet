<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><rect width="1200" height="850" fill="#f4f7f6"/><g font-family="Arial, sans-serif" fill="#142d32"><text x="40" y="55" font-size="30" font-weight="bold">SafeNet Academy · Stage 2 database</text><text x="40" y="88" font-size="17">Three application tables · BG/EN content · Auth-owned attempts</text><rect x="40" y="130" width="320" height="341" rx="12" fill="white" stroke="#b8ccc3"/><path d="M52 130h296q12 0 12 12v36h-320v-36q0-12 12-12" fill="#142d32"/><text x="58" y="161" fill="white" font-size="20" font-weight="bold">scenarios</text><text x="58" y="205" font-size="15">PK  id : integer</text><text x="58" y="230" font-size="15">category : jsonb (bg/en)</text><text x="58" y="255" font-size="15">title : jsonb (bg/en)</text><text x="58" y="280" font-size="15">description : jsonb (bg/en)</text><text x="58" y="305" font-size="15">sender : text</text><text x="58" y="330" font-size="15">message : jsonb (bg/en)</text><text x="58" y="355" font-size="15">fake_link : text</text><text x="58" y="380" font-size="15">difficulty_level : smallint</text><text x="58" y="405" font-size="15">minutes : smallint</text><text x="58" y="430" font-size="15">icon : text</text><text x="58" y="455" font-size="15">created_at : timestamptz</text><rect x="440" y="130" width="320" height="216" rx="12" fill="white" stroke="#b8ccc3"/><path d="M452 130h296q12 0 12 12v36h-320v-36q0-12 12-12" fill="#142d32"/><text x="458" y="161" fill="white" font-size="20" font-weight="bold">choices</text><text x="458" y="205" font-size="15">PK  id : integer</text><text x="458" y="230" font-size="15">FK  scenario_id : integer</text><text x="458" y="255" font-size="15">position : smallint</text><text x="458" y="280" font-size="15">text : jsonb (bg/en)</text><text x="458" y="305" font-size="15">is_correct : boolean</text><text x="458" y="330" font-size="15">feedback : jsonb (bg/en)</text><rect x="840" y="130" width="320" height="266" rx="12" fill="white" stroke="#b8ccc3"/><path d="M852 130h296q12 0 12 12v36h-320v-36q0-12 12-12" fill="#142d32"/><text x="858" y="161" fill="white" font-size="20" font-weight="bold">attempts</text><text x="858" y="205" font-size="15">PK  id : uuid</text><text x="858" y="230" font-size="15">FK  user_id : uuid</text><text x="858" y="255" font-size="15">FK  scenario_id : integer</text><text x="858" y="280" font-size="15">FK  choice_id : integer</text><text x="858" y="305" font-size="15">is_correct : boolean</text><text x="858" y="330" font-size="15">points_earned : integer</text><text x="858" y="355" font-size="15">feedback : jsonb (bg/en)</text><text x="858" y="380" font-size="15">attempted_at : timestamptz</text><rect x="840" y="530" width="320" height="116" rx="12" fill="white" stroke="#b8ccc3"/><path d="M852 530h296q12 0 12 12v36h-320v-36q0-12 12-12" fill="#142d32"/><text x="858" y="561" fill="white" font-size="20" font-weight="bold">auth.users (Supabase)</text><text x="858" y="605" font-size="15">PK  id : uuid</text><text x="858" y="630" font-size="15">System-managed identity</text><g stroke="#227154" stroke-width="2" fill="none"><path d="M360 210H440"/><path d="M760 260H840"/><path d="M200 471V505H805V335H840"/><path d="M1000 530V396"/></g><g font-size="16" fill="#227154"><text x="370" y="200">1 : N</text><text x="770" y="250">1 : N</text><text x="470" y="495">scenario 1 : N attempts</text><text x="1010" y="490">1 : N</text></g><g font-size="17"><text x="40" y="575" font-weight="bold">Integrity and access</text><text x="40" y="610">UNIQUE attempts(user_id, scenario_id)</text><text x="40" y="640">Composite FK: attempts(choice_id, scenario_id)</text><text x="40" y="666">references choices(id, scenario_id)</text><text x="40" y="705">RLS: read own attempts; writes only via submit_answer RPC.</text><text x="40" y="735">Correctness and points are computed in PostgreSQL.</text><text x="40" y="795" fill="#586e72">Design artifact — verify the deployed structure with supabase/verify.sql.</text></g></g></svg>